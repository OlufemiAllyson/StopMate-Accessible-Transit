; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = .pio/audio_data

[env:freenove_esp32_wrover]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
build_unflags = -Os
build_flags = -O3
board_build.partitions = partitions.csv
extra_scripts =
    pre:scripts/prepare_audio.py
    pre:scripts/build_edge_impulse.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    adafruit/Adafruit NeoPixel @ 1.15.5
    duinowitchery/hd44780 @ 1.3.2

; Preserve the old dependency on disk, but do not link the previous detector.
lib_ignore = StopmateWakeNet
